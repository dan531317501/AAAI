[project]
name = "react-agent"
version = "0.1.0"
description = "A simple LangGraph ReAct agent with configurable LLM endpoint and builtin + MCP tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.60",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-mcp-adapters>=0.1.6",
    "python-dotenv>=1.0.1",
]

[project.scripts]
react-agent = "agent.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
