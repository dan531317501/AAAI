[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longbridge-rest-client"
version = "0.1.0"
description = "Dependency-free OAuth 2.0 Python client for Longbridge REST OpenAPI"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["longbridge_rest_client*"]
